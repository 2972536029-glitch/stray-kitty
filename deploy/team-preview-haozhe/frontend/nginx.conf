# 前端反代:静态文件本地下发,/api 转发给游戏服务(同源,无 CORS)。
# 监听 8080(HTTP)与 8443(HTTPS)以支持非特权(nginx-unprivileged)运行;
# 443 证书由 cert sidecar(acme.sh + DuckDNS DNS-01)写入 /certs 并热加载。
server {
    listen 8080;
    listen 8443 ssl;
    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reduce text-asset transfer without recompressing PNG/WebP artwork.
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/javascript text/css image/svg+xml;

    # 游戏与支付对外 API 都走游戏服务(支付由游戏编排,前端零感知)。
    location /api/ {
        proxy_pass http://stray-kitty-game:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 15s;
    }

    # Xsolla 沙盒 webhook:支付服务唯一暴露公网的路径(精确匹配单个端点)。
    # Publisher Account 项目设置 > Webhooks 里填 https://<预览域名>/xsolla-webhook(强制 HTTPS)。
    location = /xsolla-webhook {
        proxy_pass http://stray-kitty-payment:8082/webhook/xsolla;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # 前端自身健康检查(LB/探针用),不透传后端。
    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # HTML 每次重新验证，避免刷新后继续使用上一版入口。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Only content-hashed warehouse images are immutable; keep HTML and the
    # team's unhashed public assets on their existing validation policy.
    location ~ "^/assets/warehouse_[^/]+-[A-Za-z0-9_-]{8}\.(png|webp|svg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 缺失静态资源返回 404，不能回退 HTML 冒充 JS/图片。
    location /assets/ {
        try_files $uri =404;
    }

    # SPA 路由回退。
    location / {
        try_files $uri /index.html;
    }
}
