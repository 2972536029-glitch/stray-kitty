# 前端反代:静态文件本地下发,/api 转发给游戏服务(同源,无 CORS)。
# 监听 8080 以支持非特权(nginx-unprivileged)运行。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 游戏与支付对外 API 都走游戏服务(支付由游戏编排,前端零感知)。
    location /api/ {
        proxy_pass http://stray-kitty-game:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 15s;
    }

    # 前端自身健康检查(LB/探针用),不透传后端。
    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # SPA 路由回退。
    location / {
        try_files $uri /index.html;
    }
}
