apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stray-kitty-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stray-kitty
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stray-kitty
  template:
    metadata:
      labels:
        app: stray-kitty
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: game
          image: stray-kitty:0.1.0 # 团队发布时替换为自己的已验证镜像地址和不可变 tag。
          ports:
            - containerPort: 8080
          env:
            - name: GAME_ADDR
              value: 0.0.0.0:8080
            - name: GAME_DATA_FILE
              value: /data/game.json
            - name: GAME_WEB_DIR
              value: /app/web
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
          volumeMounts:
            - name: progress
              mountPath: /data
      volumes:
        - name: progress
          persistentVolumeClaim:
            claimName: stray-kitty-data
---
apiVersion: v1
kind: Service
metadata:
  name: stray-kitty
spec:
  selector:
    app: stray-kitty
  ports:
    - port: 80
      targetPort: 8080
