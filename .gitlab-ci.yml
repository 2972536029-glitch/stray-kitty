stages: [verify, build, package, deploy]

web_checks:
  stage: verify
  image: node:24
  script:
    - npm ci --ignore-scripts
    - npm run content:check
    - npm run api:check
    - npm run architecture:check
    - npm run typecheck
    - npm test
    - npm run build --workspace web
  # The frontend image builds web/dist from source; no downstream job needs this copy.
  # Uploading the full asset bundle here can exceed GitLab's artifact upload limit.

server_checks:
  stage: verify
  image: golang:1.26
  variables:
    # server 引入 Datadog SDK 后需要拉取模块;默认 proxy.golang.org 在受限网络不可达
    GOPROXY: https://goproxy.cn,direct
  script:
    - gofmt_check=$(gofmt -l ./server) && test -z "$gofmt_check" || (echo "gofmt required:"; echo "$gofmt_check"; exit 1)
    - go -C server vet ./...
    - go -C server test -race ./...

server_build:
  stage: build
  image: golang:1.26
  variables:
    GOPROXY: https://goproxy.cn,direct
  script:
    - mkdir -p artifacts
    - CGO_ENABLED=0 go -C server build -trimpath -o ../artifacts/kitty-api ./cmd/api
  artifacts:
    paths: [artifacts/kitty-api]
    expire_in: 1 week

# ---- main 合并后:构建三服务镜像推送 GitLab Registry(digest 写入 dotenv)----
# 构建段沿用 travel-cow 已验证的 docker+dind 方案(runner 支持 dind、CI_REGISTRY
# 凭据可用);镜像 tag 用完整 commit SHA,与本地 Deploy-Preview.ps1 完全一致。
deploy_images:
  stage: package
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      touch digests.env
      for svc in game payment frontend; do
        case "$svc" in
          game)     DOCKERFILE=deploy/team-preview-haozhe/Dockerfile.game ;;
          payment)  DOCKERFILE=deploy/team-preview-haozhe/Dockerfile.payment ;;
          frontend) DOCKERFILE=deploy/team-preview-haozhe/Dockerfile.frontend ;;
        esac
        docker build --output type=image,oci-artifact=false -f "$DOCKERFILE" \
          --build-arg "BUILD_REVISION=$CI_COMMIT_SHA" \
          -t "$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHA" .
        docker push "$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHA" > push.log 2>&1 || { cat push.log; exit 1; }
        DIGEST=$(grep -o 'digest: sha256:[a-f0-9]\{64\}' push.log | tail -1 | cut -d' ' -f2)
        echo "digest $CI_REGISTRY_IMAGE/$svc@$DIGEST"
        echo "${svc}_digest=$CI_REGISTRY_IMAGE/$svc@$DIGEST" >> digests.env
      done
  artifacts:
    reports:
      dotenv: digests.env

# ---- 手动部署:渲染校验清单 → kubectl 应用 → 滚动/健康验证 → 发布归档 ----
# 复用 Deploy-Preview.ps1 的渲染(Test-PreviewConfig 离线断言)与验证链;
# 触发方式:仅 main 流水线出现,人工点击 ▶ 才执行——MR/分支拿不到受保护
# 变量 KUBECONFIG_FILE,机制上不可能触碰线上。
deploy_apply:
  stage: deploy
  image: mcr.microsoft.com/powershell:7.5-alpine-3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false
  needs: [deploy_images]
  variables:
    PAYMENT_PROBE_URL: "https://starry-kitty.duckdns.org/healthz"
  script:
    - pwsh -NoProfile -Command "Invoke-WebRequest -Uri 'https://dl.k8s.io/release/v1.34.9/bin/linux/amd64/kubectl' -OutFile /usr/local/bin/kubectl; chmod +x /usr/local/bin/kubectl; kubectl version --client=true --output=yaml | Select-Object -First 3"
    - pwsh -NoProfile -File deploy/team-preview-haozhe/Deploy-Preview.ps1 -CiMode
  artifacts:
    when: always
    paths:
      - deploy/team-preview-haozhe/releases/
    expire_in: 1 month
