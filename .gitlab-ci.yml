stages: [verify, build]

web_checks:
  stage: verify
  image: node:24
  script:
    - npm ci --ignore-scripts
    - npm run content:check
    - npm run api:check
    - npm run architecture:check
    - npm run typecheck
    - npm test
    - npm run build --workspace web
  artifacts:
    paths: [web/dist/]
    expire_in: 1 week

server_checks:
  stage: verify
  image: golang:1.26
  variables:
    # server 引入 Datadog SDK 后需要拉取模块;默认 proxy.golang.org 在受限网络不可达
    GOPROXY: https://goproxy.cn,direct
  script:
    - gofmt_check=$(gofmt -l ./server) && test -z "$gofmt_check" || (echo "gofmt required:"; echo "$gofmt_check"; exit 1)
    - go -C server vet ./...
    - go -C server test -race ./...

server_build:
  stage: build
  image: golang:1.26
  variables:
    GOPROXY: https://goproxy.cn,direct
  script:
    - mkdir -p artifacts
    - CGO_ENABLED=0 go -C server build -trimpath -o ../artifacts/kitty-api ./cmd/api
  artifacts:
    paths: [artifacts/kitty-api]
    expire_in: 1 week
