<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二章 · 事件图标预览</title><link rel="stylesheet" href="./style.css"><style>select{width:100%;margin:5px 0 8px;padding:8px;border:1px solid #65746a;background:#2c3e3c;color:#f1eed7;border-radius:4px}#locations{grid-template-columns:1fr}#gallery{grid-template-columns:repeat(3,1fr)}#movementHint{position:absolute;bottom:14px;left:14px;padding:9px 12px;background:#142b2ee8;border:1px solid #afbd9a;color:#f3e8c9;border-radius:4px;pointer-events:none}</style></head><body>
<aside><span class="tag">第二章 · 独立预览</span><h1>集市里的线索</h1><p>查看集市角色、线索与出口图标，以及已确认的道路和实物碰撞。本页图稿与浮动名称已同步到游戏。</p>
<div class="modes"><button id="candidate" class="selected">新图标</button><button id="baseline">原有标记</button></div>
<label><input id="names" type="checkbox">对照：始终显示全部名称</label>
<label for="progress">剧情状态（只影响预览）</label><select id="progress"><option value="arrival">初到集市</option><option value="crow">已获老黑羽线索</option><option value="clues">两条主线线索齐全</option><option value="cleared">战后可离开</option></select><label><input type="checkbox" id="momoDone">墨墨踪迹已查看</label>
<label for="floor">当前楼层</label><select id="floor"><option value="L0">L0 · 集市街面</option><option value="L1">L1 · 屋顶</option><option value="Lm1">L−1 · 地下暗道</option></select>
<section><h2>逐个查看</h2><div id="locations"></div></section><section><h2>图稿对照</h2><div id="gallery"></div></section>
<div class="modes"><button id="backAway">退远看淡出</button><button id="fit">查看全图</button></div>
<p class="hint">方向键 / WASD 行走，E 查看提示，C / F 使用原有跨越与楼层连接。滚轮缩放，右键拖动，按住 Tab 只看底图。</p><output id="status">加载中…</output><p class="hint">图标可见；名称靠近浮现、离开淡出，当前主线目标保留名称。随机事件区不画标记。本页不连接 API，不读写存档。</p>
</aside><main><header><strong>第二章 · 事件图标与浮动名称</strong><span>像素风格 · 对比配色 · 先预览再接入</span></header><div id="stage"><canvas id="map" tabindex="0" aria-label="第二章事件图标与三层试走预览"></canvas><div id="badge" class="badge">新图标 · 主线目标常显</div><div id="movementHint" hidden></div><div id="feedback" role="status"></div></div><footer>沿用已确认的道路、货箱与 C / F 规则 · 新图标共用一张缓存画布 · 不改变事件内容</footer></main><script type="module" src="./main.ts"></script></body></html>
