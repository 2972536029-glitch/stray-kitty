# Datadog Agent DaemonSet(单节点 kind / 小规模集群形态)
# 手写而非 Helm:yaml 全透明、可进 git(沿用旅行牛牛项目的决策)。
# 应用 pod 侧需要配 DD_AGENT_HOST=status.hostIP(Downward API 取节点 IP,
# Agent 以 hostPort 8125/8126 暴露),见 deploy/team-preview-haozhe 的 Deployment 补丁。
# 前置:kubectl -n datadog create secret generic datadog-secret --from-literal=api-key=<KEY>
# 应用:kubectl apply -f k8s/datadog-agent.yaml
#
# 以下是旅行牛牛项目在 kind 上实测踩过的三个坑,均已内置修复,勿删:
#  1. kind 节点解析不出自身主机名 → Agent exit 255 循环重启 → 必须显式 DD_HOSTNAME=spec.nodeName
#  2. containerd 环境探测不到 CRI socket → 容器数 0、Logs 恒为 0 →
#     显式注入 DD_CRI_SOCKET_PATH + DD_CONTAINERD_SOCKET_PATH(两个都是真实存在的变量名)
#  3. /var/log/pods 文件采集在受限环境不可靠时,应用侧已有 HTTP Logs Intake 旁路兜底
#     (server/internal/obs/logshipper.go,DD_LOGS_INTAKE_KEY 未配置时 no-op)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog-agent
  namespace: datadog
  labels:
    app: datadog-agent
spec:
  selector:
    matchLabels:
      app: datadog-agent
  template:
    metadata:
      labels:
        app: datadog-agent
      name: datadog-agent
    spec:
      serviceAccountName: datadog-agent
      hostPID: true          # 进程/容器采集需要宿主 PID 视角
      containers:
        - name: agent
          # 受限网络下 gcr.io 指定版本 tag 拉不到;先在可达环境 pull/load 本地镜像再应用,
          # 云环境请改回 gcr.io/datadoghq/agent:<精确版本>
          image: gcr.io/datadoghq/agent:7
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef: { name: datadog-secret, key: api-key }
            - name: DD_SITE
              value: "datadoghq.com"
            - name: DD_ENV
              value: "dev"
            - name: DD_TAGS
              value: "team:stray-kitty"
            # kind 节点解析不出自身主机名(Agent exit 255 根因),显式指定
            - name: DD_HOSTNAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # containerd 环境:不显式指定 CRI socket,Agent 探测不到容器,
            # 容器数为 0 且日志采集(LogsProcessed)恒为 0
            - name: DD_CRI_SOCKET_PATH
              value: "/run/containerd/containerd.sock"
            - name: DD_CONTAINERD_SOCKET_PATH
              value: "/run/containerd/containerd.sock"
            # ---- APM:接收全节点的 trace ----
            - name: DD_APM_ENABLED
              value: "true"
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: "true"
            # ---- DogStatsD:接收全节点的指标 ----
            - name: DD_DOGSTATSD_NON_LOCAL_TRAFFIC
              value: "true"
            # ---- 日志:采集全部容器 stdout ----
            - name: DD_LOGS_ENABLED
              value: "true"
            - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
              value: "true"
            # 不采集 Agent 自己,降噪
            - name: DD_CONTAINER_EXCLUDE
              value: "name:datadog-agent"
          ports:
            - { containerPort: 8126, hostPort: 8126, name: apm, protocol: TCP }
            - { containerPort: 8125, hostPort: 8125, name: dogstatsd, protocol: UDP }
          volumeMounts:
            # kind 用 containerd:没有这个 socket,Agent 拿不到容器元数据,
            # /var/log/pods 里的日志文件无法关联容器 → LogsProcessed 恒为 0
            - { name: containerdsocket, mountPath: /run/containerd/containerd.sock, readOnly: true }
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: cgroup, mountPath: /host/sys/fs/cgroup, readOnly: true }
            - { name: points, mountPath: /var/log/pods, readOnly: true }
            - { name: containerdlog, mountPath: /var/log/containers, readOnly: true }
          livenessProbe:
            exec: { command: ["agent", "status"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: containerdsocket
          hostPath: { path: /run/containerd/containerd.sock }
        - name: proc
          hostPath: { path: /proc }
        - name: cgroup
          hostPath: { path: /sys/fs/cgroup }
        - name: points
          hostPath: { path: /var/log/pods }
        - name: containerdlog
          hostPath: { path: /var/log/containers }
      tolerations:
        - operator: Exists    # 单节点 kind:control-plane 有 taint,Agent 必须能落上去
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
  namespace: datadog
---
# 只读权限:节点发现/pod 元数据/kube 指标采集
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/spec", "nodes/proxy", "pods", "services", "endpoints", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward", "configmaps"]
    verbs: ["create", "get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["datadog-leader-election"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-agent
subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: datadog
